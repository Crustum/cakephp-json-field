name: CI

on:
  push:
    branches:
      - 'main'
      - '1.x'
      - '2.x'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.5'
            db-type: 'sqlite'
            dependencies: lowest
          - php-version: '8.5'
            db-type: 'sqlite'
            dependencies: highest
          - php-version: '8.5'
            db-type: 'mysql'
            dependencies: highest
          - php-version: '8.5'
            db-type: 'pgsql'
            dependencies: highest

    steps:
    - name: Setup MySQL
      if: matrix.db-type == 'mysql'
      run: docker run --rm --name=mysql -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=jsonfield_test -p 3306:3306 -d mysql:8.4

    - name: Setup PostgreSQL
      if: matrix.db-type == 'pgsql'
      run: docker run --rm --name=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=jsonfield_test -p 5432:5432 -d postgres:15

    - name: Wait for database
      if: matrix.db-type == 'mysql' || matrix.db-type == 'pgsql'
      run: |
        if [[ "${{ matrix.db-type }}" == 'mysql' ]]; then
          for i in $(seq 1 30); do docker exec mysql mysql -uroot -proot -e 'SELECT 1;' && break || sleep 2; done
          docker exec mysql mysql -uroot -proot -e 'SELECT 1;'
        fi
        if [[ "${{ matrix.db-type }}" == 'pgsql' ]]; then
          for i in $(seq 1 30); do docker exec postgres pg_isready -U postgres && break || sleep 2; done
          docker exec postgres pg_isready -U postgres
        fi

    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, pdo_${{ matrix.db-type }}
        coverage: pcov
        ini-values: apc.enable_cli = 1, zend.assertions = 1, pcov.directory = src

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

    - name: composer install
      run: |
        if [[ "${{ matrix.dependencies }}" == 'lowest' ]]; then
          composer update --prefer-lowest --prefer-stable --no-progress
        else
          composer install --no-progress
        fi

    - name: Run PHPUnit
      run: |
        if [[ "${{ matrix.db-type }}" == 'mysql' ]]; then export db_dsn="mysql://root:root@127.0.0.1:3306/jsonfield_test?encoding=utf8mb4&timezone=UTC&cacheMetadata=true&quoteIdentifiers=true&persistent=false&className=Cake\Database\Connection&driver=Crustum\JsonField\Database\Driver\JsonFieldMysqlDriver"; fi
        if [[ "${{ matrix.db-type }}" == 'pgsql' ]]; then export db_dsn="postgres://postgres:postgres@127.0.0.1:5432/jsonfield_test?encoding=utf8&timezone=UTC&cacheMetadata=true&quoteIdentifiers=false&persistent=false&className=Cake\Database\Connection&driver=Crustum\JsonField\Database\Driver\JsonFieldPostgresDriver"; fi
        if [[ "${{ matrix.db-type }}" == 'sqlite' ]]; then export db_dsn="sqlite:///:memory:?className=Cake\Database\Connection&driver=Crustum\JsonField\Database\Driver\JsonFieldSqliteDriver"; fi
        vendor/bin/phpunit --configuration=phpunit.xml.dist

  cs-stan:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, intl
        coverage: none

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

    - name: composer install
      run: composer install --no-progress

    - name: Run PHP CodeSniffer
      run: composer cs-check

    - name: Run Rector Check
      run: composer rector-check

    - name: Run phpstan
      run: composer stan
